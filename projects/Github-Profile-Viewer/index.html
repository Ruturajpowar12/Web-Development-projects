<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github-Profile-Viewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box1">
      <h1>GitHub Profile Viewer</h1>
      <input type="text" placeholder="Enter your github username:" />
      <button id="viewprofile">View</button>
    </div>
    <div class="box2">
      <img src="https://avatars.githubusercontent.com/u/1?v=4" alt="" />
      <h2 id="name">mojombo</h2>

      <div class="info">
        <div class="box">
          <h3>followers</h3>
          <h4 id="follower">34</h4>
        </div>
        <div class="box">
          <h3>following</h3>
          <h4 id="following">12</h4>
        </div>
        <div class="box">
          <h3>repositories</h3>
          <h4 id="repo">10</h4>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
