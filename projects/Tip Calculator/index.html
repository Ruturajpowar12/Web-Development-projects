<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Tip Calculator</h1>
      <h3>Enter the bill amount and tip percentage to calculate the total.</h3>
      <label for="amount">Bill Amount :</label>
      <input type="number" id="billAmount" />
      <label for="amount"> Tip percentage :</label>
      <input type="number" id="tipPercentage" />
      <button id="calBtn">CALCULATE</button>

      <div class="info">
        <p>Total :</p>
        <span id="res"></span>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
