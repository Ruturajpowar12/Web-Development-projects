<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1>Portfolio</h1>
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Skills</li>
          <li>Contact</li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="home">
        <img
          src="./assets/WhatsApp Image 2026-05-10 at 5.31.00 PM.jpeg"
          alt="userPhoto"
        />
      </section>
      <section class="about">
        <h1>About</h1>
        <div class="combine">
          <div class="aboutleft">
            <h1>Ruturaj Powar</h1>
            <h2>I am a MERN Stack Developer</h2>
            <div class="btns">
              <button>Download CV</button>
              <button>Contact Me</button>
            </div>
          </div>
          <div class="aboutright">
            <p>
              A full-stack developer who enjoys building modern interfaces,
              reliable APIs, and recruiter-ready web experiences with the MERN
              stack.
            </p>
          </div>
        </div>
      </section>
      <section class="skills"></section>
    </main>
  </body>
</html>
