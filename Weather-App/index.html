<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module"></script>
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false" id="cityInput">
            <button id="searchBtn"><img src="./assets/search.png" alt="Search Icon"></button>
        </div>
        <div class="weather-info">
            <img src="./assets/rain.png" alt="Weather Image">
            <h1 class="temp">25°C</h1>
            <h2 class="city">New York</h2>
        </div>

        <div class="details">
            <div class="col">
                <img src="./assets/humidity.png" alt="Humidity Icon">
                <div>
                    <p class="humidity">60%</p>
                    <p>Humidity</p>
                </div>

            </div>
            <div class="col">
                <img src="./assets/wind.png" alt="Wind Icon">
                <div>

                    <p class="wind">15 km/h</p>
                    <p>Wind Speed</p>
                </div>

            </div>

        </div>



    </div>



</body>

</html>
